<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#020617" />
        <meta name="google-site-verification" content="L10xKqIZyN8dY9z8RpmrOvysKGP2QJc2Xd95upDN6Cc" />
    <meta name="description" content="Postorico - Gérez votre présence sur les réseaux sociaux" />
        <link rel="icon" href="%PUBLIC_URL%/logo.png" type="image/png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
        <title>Postorico</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script>
          // La home est prérendue dans index.html (pour le SEO de « / »). Ce même
          // fichier sert de repli SPA pour /dashboard et /admin : sans ce garde,
          // ces routes affichent la home une fraction de seconde avant que React
          // prenne la main (le « flash accueil » au rechargement). On vide donc le
          // contenu prérendu et on pose le fond sombre de l'app dès le chargement,
          // avant même le bundle. Aucun effet sur « / » ni les pages marketing.
          (function () {
            try {
              if (/^\/(dashboard|admin)(\/|$)/.test(location.pathname)) {
                document.documentElement.style.background = '#020617';
                document.body.style.background = '#020617';
                var r = document.getElementById('root');
                if (r) r.textContent = '';
              }
            } catch (e) { /* pas de garde -> au pire, le comportement d'avant */ }
          })();
        </script>
    </body>
</html>
