<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Séquence v3 — vignettes compactes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020617;
    --card: #0f172a;
    --panel: #0a1120;
    --ink: #e2e8f0;
    --muted: #64748b;
    --accent: #3AFFA3;
    --g1: #5B6CFF;
    --g2: #8A6CFF;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .dialog {
    width: min(1100px, 96vw);
    max-height: 92vh;
    background: var(--card);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 40px 120px rgba(0,0,0,.6);
  }
  .dlg-head { padding: 22px 26px 0; }
  .dlg-head h1 { font-family: 'Sora'; font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
  .dlg-head p { color: #94a3b8; font-size: 13.5px; margin-top: 6px; }

  .dlg-body {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    min-height: 0;
  }

  /* ---- GAUCHE : vignettes compactes ---- */
  .tpl-zone { padding: 18px 22px 22px 26px; overflow-y: auto; min-height: 0; }
  .zone-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .zone-label {
    font-size: 11px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted);
  }
  .zone-sel { font-size: 12px; color: var(--accent); font-weight: 600; margin-left: auto; }

  .tpl-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 12px;
  }
  .tile {
    position: relative;
    cursor: pointer;
    transition: transform 150ms var(--ease-out);
  }
  .tile:hover { transform: translateY(-3px); }
  .tile:active { transform: scale(0.95); }
  .thumb {
    position: relative;
    aspect-ratio: 9 / 16;
    border-radius: 12px;
    overflow: hidden;
    background: #060b18;
    border: 1.5px solid rgba(255,255,255,.09);
    transition: border-color 150ms var(--ease-out), box-shadow 150ms var(--ease-out);
  }
  .tile:hover .thumb { border-color: rgba(138,108,255,.6); }
  .tile.on .thumb {
    border-color: var(--accent);
    box-shadow: 0 0 0 1.5px var(--accent), 0 8px 30px rgba(58,255,163,.14);
  }
  .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* voile + coche sur la vignette sélectionnée */
  .tile.on .thumb::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 55%, rgba(2,6,23,.55));
  }
  .check {
    position: absolute; right: 6px; bottom: 6px; z-index: 2;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: #05261a;
    display: none; place-items: center;
    font-size: 12px; font-weight: 800;
  }
  .tile.on .check { display: grid; }
  .star {
    position: absolute; left: 6px; top: 6px; z-index: 2;
    font-size: 10px; font-weight: 800; letter-spacing: .02em;
    color: #05261a; background: var(--accent);
    padding: 2px 7px; border-radius: 99px;
  }
  /* loupe : visible au survol seulement */
  .btn-zoom {
    position: absolute; right: 6px; top: 6px; z-index: 3;
    width: 26px; height: 26px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(2,6,23,.75);
    color: #fff;
    display: grid; place-items: center;
    cursor: zoom-in;
    opacity: 0; transform: scale(.9);
    transition: opacity 130ms var(--ease-out), transform 130ms var(--ease-out);
    backdrop-filter: blur(5px);
  }
  .tile:hover .btn-zoom { opacity: 1; transform: scale(1); }
  .btn-zoom:active { transform: scale(.9); }
  .btn-zoom svg { width: 12px; height: 12px; }

  .tname {
    margin-top: 7px;
    font-family: 'Sora'; font-size: 11.5px; font-weight: 700;
    text-align: center; color: #cbd5e1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile.on .tname { color: var(--accent); }

  /* ---- DROITE : images + consignes ---- */
  .img-zone {
    border-left: 1px solid rgba(255,255,255,.07);
    padding: 18px 26px 22px 22px;
    overflow-y: auto; min-height: 0;
    display: flex; flex-direction: column; gap: 17px;
    background: rgba(2,6,23,.35);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    position: relative; width: 60px; height: 60px;
    border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.1); cursor: pointer;
    transition: transform 140ms var(--ease-out);
  }
  .chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chip:active { transform: scale(.95); }
  .chip.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .chip .num { position: absolute; bottom: 3px; left: 3px; font-size: 10px; font-weight: 800; color: #fff; background: rgba(0,0,0,.65); border-radius: 5px; padding: 1px 5px; }
  .chip .rm { position: absolute; top: 3px; right: 3px; width: 17px; height: 17px; border-radius: 50%; background: rgba(0,0,0,.72); color: #fff; border: 0; font-size: 11px; cursor: pointer; display: grid; place-items: center; }
  .chip .ok { position: absolute; inset: 0; background: rgba(58,255,163,.18); display: grid; place-items: center; color: var(--accent); font-weight: 800; font-size: 14px; }
  .btn-import {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 10px;
    border: 1px dashed rgba(91,108,255,.5); color: #a5b0ff; background: none; cursor: pointer;
    transition: background 140ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .btn-import:hover { background: rgba(91,108,255,.1); }
  .btn-import:active { transform: scale(.97); }
  .count { font-size: 11px; color: var(--muted); margin-left: 8px; }
  textarea {
    width: 100%; min-height: 70px; resize: none;
    background: rgba(2,6,23,.6); border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 10px 12px;
    color: var(--ink); font-family: 'Inter'; font-size: 13px; outline: none;
    transition: border-color 140ms var(--ease-out);
  }
  textarea:focus { border-color: rgba(91,108,255,.5); }
  textarea::placeholder { color: #475569; }
  .zone-label-s { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 9px; }

  .dlg-foot {
    display: flex; justify-content: flex-end; align-items: center; gap: 10px;
    padding: 13px 26px;
    border-top: 1px solid rgba(255,255,255,.07);
  }
  .btn-ghost {
    font-size: 13px; color: #94a3b8; padding: 9px 16px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,.1); background: none; cursor: pointer;
    transition: color 140ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .btn-ghost:hover { color: #fff; }
  .btn-ghost:active { transform: scale(.97); }
  .btn-cta {
    font-size: 13.5px; font-weight: 700; color: #fff;
    padding: 10px 22px; border-radius: 10px; border: 0; cursor: pointer;
    background: linear-gradient(90deg, var(--g1), var(--g2));
    transition: transform 140ms var(--ease-out), opacity 140ms var(--ease-out);
  }
  .btn-cta:hover { opacity: .92; }
  .btn-cta:active { transform: scale(.97); }

  /* ---- LIGHTBOX (identique v2 : validée) ---- */
  .lb {
    position: fixed; inset: 0; z-index: 50;
    display: grid; place-items: center;
    background: rgba(2,6,23,.82); backdrop-filter: blur(8px);
    opacity: 0; pointer-events: none;
    transition: opacity 200ms var(--ease-out);
  }
  .lb.open { opacity: 1; pointer-events: auto; }
  .lb-panel { display: flex; align-items: center; gap: 34px; transform: scale(.95); transition: transform 220ms var(--ease-out); }
  .lb.open .lb-panel { transform: scale(1); }
  .lb-video {
    height: min(76vh, 720px); aspect-ratio: 9 / 16;
    border-radius: 22px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 30px 90px rgba(0,0,0,.65); background: #060b18;
  }
  .lb-video video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .lb-side { max-width: 330px; }
  .lb-side .kicker { font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  .lb-side h2 { font-family: 'Sora'; font-size: 30px; font-weight: 800; margin-top: 8px; letter-spacing: -.02em; }
  .lb-side p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-top: 12px; }
  .lb-tags { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 16px; }
  .lb-tags span { font-size: 11px; color: #7c8aa0; border: 1px solid rgba(255,255,255,.12); border-radius: 99px; padding: 3px 10px; }
  .lb-actions { display: flex; gap: 10px; margin-top: 26px; }
  .lb-nav {
    position: absolute; top: 50%; translate: 0 -50%;
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.16); background: rgba(15,23,42,.8); color: #fff;
    font-size: 19px; cursor: pointer; display: grid; place-items: center;
    transition: background 140ms var(--ease-out), transform 140ms var(--ease-out);
  }
  .lb-nav:hover { background: rgba(91,108,255,.35); }
  .lb-prev { left: 26px; }
  .lb-next { right: 26px; }
  .lb-close {
    position: absolute; top: 22px; right: 26px;
    width: 40px; height: 40px; border-radius: 11px;
    border: 1px solid rgba(255,255,255,.16); background: rgba(15,23,42,.8);
    color: #fff; font-size: 17px; cursor: pointer;
  }

  @media (max-width: 900px) {
    .dlg-body { grid-template-columns: 1fr; }
    .img-zone { border-left: 0; border-top: 1px solid rgba(255,255,255,.07); }
    .tpl-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); }
    .lb-panel { flex-direction: column; gap: 18px; }
    .lb-video { height: 58vh; }
    .lb-side { text-align: center; max-width: 88vw; }
    .lb-actions { justify-content: center; }
  }
</style>
</head>
<body>

<div class="dialog">
  <div class="dlg-head">
    <h1>Reel Séquence</h1>
    <p>Choisis ton template (loupe pour l'agrandir), tes images, et l'IA monte la vidéo.</p>
  </div>

  <div class="dlg-body">
    <div class="tpl-zone">
      <div class="zone-head">
        <span class="zone-label">Templates</span>
        <span class="zone-sel" id="selName"></span>
      </div>
      <div class="tpl-grid" id="grid"></div>
    </div>

    <div class="img-zone">
      <div>
        <div class="zone-label-s">Images du reel (dans l'ordre)</div>
        <div class="chips">
          <div class="chip sel"><img src="cine-img/h2.jpg" alt=""><span class="num">1</span><button class="rm">×</button></div>
          <div class="chip sel"><img src="cine-img/h5.jpg" alt=""><span class="num">2</span><button class="rm">×</button></div>
        </div>
      </div>
      <div>
        <div class="zone-label-s">Visuels du post</div>
        <div class="chips">
          <div class="chip sel"><img src="cine-img/h2.jpg" alt=""><span class="ok">✓</span></div>
        </div>
      </div>
      <div>
        <button class="btn-import">＋ Ajouter des images</button><span class="count">2/6</span>
      </div>
      <div>
        <div class="zone-label-s">Ta banque d'images</div>
        <div class="chips">
          <div class="chip sel"><img src="cine-img/h5.jpg" alt=""><span class="ok">✓</span></div>
          <div class="chip"><img src="cine-img/h1.jpg" alt=""></div>
          <div class="chip"><img src="cine-img/h4.jpg" alt=""></div>
          <div class="chip"><img src="cine-img/h7.jpg" alt=""></div>
          <div class="chip"><img src="cine-img/h8.jpg" alt=""></div>
        </div>
      </div>
      <div>
        <div class="zone-label-s">Consignes (optionnel)</div>
        <textarea placeholder="Ex : mets l'accent sur la promo -20 %, ton énergique, termine sur le logo…"></textarea>
      </div>
    </div>
  </div>

  <div class="dlg-foot">
    <button class="btn-ghost">Annuler</button>
    <button class="btn-cta">Faire le montage</button>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <button class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-panel">
    <div class="lb-video"><video id="lbVideo" autoplay muted loop playsinline></video></div>
    <div class="lb-side">
      <div class="kicker">Aperçu du template</div>
      <h2 id="lbName"></h2>
      <p id="lbDesc"></p>
      <div class="lb-tags" id="lbTags"></div>
      <div class="lb-actions">
        <button class="btn-ghost" id="lbCancel">Fermer</button>
        <button class="btn-cta" id="lbPick">Choisir ce template</button>
      </div>
    </div>
  </div>
</div>

<script>
const CDN = 'https://res.cloudinary.com/dy9gp5pim/video/upload/reels/_templates';
// Les 10 styles réels — dans la maquette les nouveaux réutilisent les 3 vidéos
// existantes en attendant leurs aperçus (les URLs finales suivent le même motif).
const V = { sig: CDN + '/sequence-signature.mp4', cin: CDN + '/sequence-cinema.mp4', edi: CDN + '/sequence-editorial.mp4' };
const TEMPLATES = [
  { id: 'signature',  nom: 'Signature',   src: V.sig, reco: true, desc: "Le montage pro : plans multiples composés par l'IA — tes visuels, textes animés, unique à chaque post.", tags: ['Tous usages'] },
  { id: 'cinema',     nom: 'Cinéma',      src: V.cin, desc: "Écriture cinéma : letterbox, légendes élégantes, rythme posé.", tags: ['Haut de gamme'] },
  { id: 'editorial',  nom: 'Éditorial',   src: V.edi, desc: "Façon magazine : cadre fin, numéros de page, accents nets.", tags: ['Marques'] },
  { id: 'impact',     nom: 'Impact',      src: V.sig, desc: "Noir et brutal : mots énormes, coupes sèches, flashs.", tags: ['Punchy'] },
  { id: 'odyssee',    nom: 'Odyssée',     src: V.cin, desc: "Profondeur spatiale : images traversées en zoom, typo espacée.", tags: ['Spectaculaire'] },
  { id: 'vlog',       nom: 'Vlog',        src: V.edi, desc: "Esprit vlog : stickers, cadre caméra REC, image qui respire.", tags: ['Casual'] },
  { id: 'carnet',     nom: 'Carnet',      src: V.sig, desc: "Carnet de voyage : polaroids scotchés, écriture manuscrite.", tags: ['Voyage'] },
  { id: 'avantapres', nom: 'Avant/Après', src: V.cin, desc: "La preuve par l'image : visuels badgés AVANT puis APRÈS.", tags: ['Transformation'] },
  { id: 'temoignage', nom: 'Témoignage',  src: V.edi, desc: "Avis client mis en scène : 5 étoiles, citation serif, signature.", tags: ['Confiance'] },
  { id: 'conseils',   nom: 'Conseils',    src: V.sig, desc: "Accroche puis conseils numérotés — le format qui se sauvegarde.", tags: ['Éducatif'] },
];

let selected = 'signature';
let lbIndex = 0;
const grid = document.getElementById('grid');

function render() {
  grid.innerHTML = '';
  TEMPLATES.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'tile' + (selected === t.id ? ' on' : '');
    el.innerHTML = `
      <div class="thumb">
        <video src="${t.src}" autoplay muted loop playsinline></video>
        ${t.reco ? '<span class="star">★ Reco</span>' : ''}
        <button class="btn-zoom" title="Agrandir" aria-label="Agrandir l'aperçu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
          </svg>
        </button>
        <span class="check">✓</span>
      </div>
      <div class="tname">${t.nom}</div>`;
    el.addEventListener('click', (e) => {
      if (e.target.closest('.btn-zoom')) { openLb(i); return; }
      selected = t.id; render();
    });
    grid.appendChild(el);
  });
  const sel = TEMPLATES.find(t => t.id === selected);
  document.getElementById('selName').textContent = sel ? '✓ ' + sel.nom : '';
}

const lb = document.getElementById('lb');
const lbVideo = document.getElementById('lbVideo');
function openLb(i) {
  lbIndex = (i + TEMPLATES.length) % TEMPLATES.length;
  const t = TEMPLATES[lbIndex];
  lbVideo.src = t.src;
  document.getElementById('lbName').textContent = t.nom;
  document.getElementById('lbDesc').textContent = t.desc;
  document.getElementById('lbTags').innerHTML = (t.tags || []).map(x => `<span>${x}</span>`).join('');
  lb.classList.add('open');
}
function closeLb() { lb.classList.remove('open'); lbVideo.pause(); }
document.getElementById('lbClose').onclick = closeLb;
document.getElementById('lbCancel').onclick = closeLb;
document.getElementById('lbPrev').onclick = () => openLb(lbIndex - 1);
document.getElementById('lbNext').onclick = () => openLb(lbIndex + 1);
document.getElementById('lbPick').onclick = () => { selected = TEMPLATES[lbIndex].id; closeLb(); render(); };
lb.addEventListener('click', (e) => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', (e) => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') openLb(lbIndex - 1);
  if (e.key === 'ArrowRight') openLb(lbIndex + 1);
});

render();
</script>
</body>
</html>
