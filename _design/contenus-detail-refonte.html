<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Contenus — détail (refonte)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#020617; --card:#0f172a; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --grad:linear-gradient(135deg,#5B6CFF,#8A6CFF); --accent:#3AFFA3;
    --ink:#e5e7eb; --mut:#94a3b8; --mut2:#64748b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#05070d;color:var(--ink);font-family:'Inter',sans-serif;height:100%}
  #root{height:100%}
  .sora{font-family:'Sora',sans-serif}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}
  .devbar{position:fixed;top:0;left:0;right:0;min-height:46px;background:#000;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:8px 16px;font-family:'Inter',sans-serif;font-size:12.5px;color:var(--mut);z-index:50;flex-wrap:wrap}
  .devbar b{color:#fff;font-weight:600}
  .devbtn{background:var(--card);border:1px solid var(--line2);color:var(--ink);border-radius:7px;padding:5px 10px;
    font-size:12px;font-family:'Inter',sans-serif;cursor:pointer}
  .devbtn.on{border-color:var(--accent);color:var(--accent)}
  .stage{position:absolute;inset:46px 0 0 0;display:grid;place-items:center;background:
    radial-gradient(1200px 700px at 50% -10%, rgba(91,108,255,.10), transparent 60%), var(--bg)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

/* ------------------------------------------------------------------
   ASSUMPTIONS (a valider avant implementation reelle) :
   1. Meme bug de fond que le dialogue Miniature deja corrige : la colonne
      de texte (souvent tres longue) n'a pas de limite -> toute la page
      scrolle, footer (Reessayer/Replanifier/Supprimer) hors champ.
   2. On NE tronque PAS le texte du post (contrairement a une carte de
      liste) : l'utilisateur doit pouvoir le relire en entier avant de
      decider. Donc : hauteur de dialogue fixe, la colonne TEXTE scrolle
      seule dans son propre espace borne, la colonne MEDIA (a gauche) ne
      bouge jamais, le footer est toujours visible.
   3. Video de reference : pas de vrai fichier disponible ici -> aplat
      degrade + libelle, meme convention que les autres maquettes deja
      validees (Miniature, Chiffres cles).
------------------------------------------------------------------- */

const TEXTE_COURT = `Pendant 8 mois, j'ai posé la même question à mon associé chaque lundi matin.

« T'as publié quelque chose cette semaine ? »

Sa réponse était toujours la même.
Un silence. Puis un « non, j'ai pas eu le temps ».

Sur LinkedIn, on n'existait pas.`;

const TEXTE_LONG = `Pendant 8 mois, j'ai posé la même question à mon associé chaque lundi matin.

« T'as publié quelque chose cette semaine ? »

Sa réponse était toujours la même.
Un silence. Puis un « non, j'ai pas eu le temps ».

On s'est pas disputés là-dessus.
On s'est juste regardés, un peu gênés, en sachant tous les deux que c'était un problème.

Parce qu'on avait beau avoir une bonne offre, des clients satisfaits, des références solides…
Sur LinkedIn, on n'existait pas.

Et dans nos secteurs, ne pas exister en ligne, ça coûte des opportunités.
Des prospects qui auraient pu nous trouver.
Des partenaires qui auraient pu nous recommander.
Un recrutement qui aurait pu être plus simple si notre marque était visible.

On a testé plusieurs choses avant d'arriver à un système qui tient :

1. Un stagiaire à mi-temps. Motivé au début, mais la régularité s'effondre dès la première semaine chargée.
2. Une agence. Cher, lent, et le ton ne sonnait jamais tout à fait comme nous.
3. « On le fera nous-mêmes, promis ». On connaît la suite.

Ce qui a fini par marcher, c'est de sortir la publication du calendrier mental de quelqu'un et de la mettre dans un système qui ne dépend de personne d'humeur variable.

Concrètement : le contenu est généré à partir de ce qu'on fait déjà (les posts qu'on écrit spontanément, les coulisses, les résultats clients), calé sur notre voix, et il ne part qu'après qu'on l'ait relu et validé.

Ça a changé trois choses très concrètes :
— On publie même les semaines chargées.
— Le ton reste cohérent d'un post à l'autre, même si ce n'est pas toujours la même personne qui valide.
— Le temps qu'on y passe est prévisible : plus de session improvisée à 23h un dimanche.

Avec Postorico, ta fiche Google est alimentée en même temps que tes réseaux. Tu valides, c'est publié. Tu restes visible sans y penser tous les matins.

Ta fiche Google, elle ressemble à quoi en ce moment ? Dis-nous en commentaire.`;

function CloseIcon(props){
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
      <path d="M6 6l12 12M18 6L6 18" strokeLinecap="round" />
    </svg>
  );
}
function TrashIcon(props){
  return (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...props}>
      <path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m-8 0 1 13a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2l1-13" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}
function RefreshIcon(props){
  return (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...props}>
      <path d="M3 12a9 9 0 0 1 15.3-6.4M21 12a9 9 0 0 1-15.3 6.4M18 4v5h-5M6 20v-5h5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}
function CalendarIcon(props){
  return (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...props}>
      <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18" strokeLinecap="round"/>
    </svg>
  );
}
function ClapperIcon(props){
  return (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...props}>
      <path d="M4 10.5 19 7l1 4-15 3.5z"/><path d="M3 12l16.5-3.5L21 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>
      <path d="M7.5 9.2 9 12M12 8.3 13.5 11" strokeLinecap="round"/>
    </svg>
  );
}
function VideoIcon(props){
  return (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...props}>
      <rect x="2.5" y="6" width="14" height="12" rx="2"/><path d="m16.5 10.5 5-3v9l-5-3z" strokeLinejoin="round"/>
    </svg>
  );
}
function LinkedInIcon(props){
  return (
    <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" {...props}>
      <path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9h4v12H3zm7 0h3.6v1.7h.05c.5-.9 1.7-1.85 3.5-1.85 3.75 0 4.45 2.45 4.45 5.65V21h-4v-5.6c0-1.35 0-3.1-1.9-3.1-1.9 0-2.2 1.5-2.2 3v5.7h-4z"/>
    </svg>
  );
}
function FailIcon(props){
  return (
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" {...props}>
      <path d="M6 6l12 12M18 6L6 18" strokeLinecap="round" />
    </svg>
  );
}
function ScissorsIcon(props){
  return (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...props}>
      <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
      <path d="M8.5 8.5 20 20M20 4 8.5 15.5" strokeLinecap="round"/>
    </svg>
  );
}
function WandIcon(props){
  return (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" {...props}>
      <path d="m15 4 1 2 2 1-2 1-1 2-1-2-2-1 2-1zM5 20l9-9M19 13l.7 1.6L21.5 15l-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}
function SparkleIcon(props){
  return (
    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" {...props}>
      <path d="M12 2l1.8 5.7L19.5 9 13.8 10.9 12 16.6l-1.8-5.7L4.5 9l5.7-1.3L12 2z" />
    </svg>
  );
}

function ContenuDialog({ texteLong, type }) {
  const texte = texteLong ? TEXTE_LONG : TEXTE_COURT;
  const [retoucheOuverte, setRetoucheOuverte] = useState(false);
  return (
    <div style={{
      width: 980, maxHeight: '90vh', display: 'flex', flexDirection: 'column',
      background: 'var(--card)', borderRadius: 20, border: '1px solid var(--line)',
      boxShadow: '0 30px 90px rgba(0,0,0,.55)', overflow: 'hidden',
    }}>
      {/* HEADER — fixe : badges + titre + fermer */}
      <div style={{ padding: '18px 22px 16px', borderBottom: '1px solid var(--line)', flexShrink: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '4px 10px', borderRadius: 99,
            background: 'rgba(168,85,247,.14)', color: '#c4b5fd', fontSize: 12, fontWeight: 700, fontFamily: 'Sora,sans-serif' }}>
            <span style={{ width: 5, height: 5, borderRadius: '50%', background: '#c4b5fd' }} />Planifié
          </span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 99,
            background: '#0A66C2', color: '#fff', fontSize: 12, fontWeight: 700, fontFamily: 'Sora,sans-serif' }}>
            <LinkedInIcon />LinkedIn
          </span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 10px', borderRadius: 99,
            background: 'rgba(239,68,68,.14)', color: '#fca5a5', fontSize: 12, fontWeight: 700, fontFamily: 'Sora,sans-serif' }}>
            <FailIcon />Échec
          </span>
          <button type="button" aria-label="Fermer" style={{
            marginLeft: 'auto', width: 32, height: 32, borderRadius: 9, border: '1px solid var(--line2)',
            background: 'transparent', color: 'var(--mut)', display: 'grid', placeItems: 'center', cursor: 'pointer', flexShrink: 0,
          }}><CloseIcon /></button>
        </div>
        <h2 className="sora" style={{ margin: 0, fontSize: 18, fontWeight: 700, color: '#fff', lineHeight: 1.3, maxWidth: 880 }}>
          J'ai arrêté de demander à mon associé « T'as publié quelque chose cette semaine ? », voici pourquoi
        </h2>
      </div>

      {/* CORPS — media (gauche, fixe) + texte (droite, scroll independant) partagent la meme hauteur.
          flex (pas grid a hauteur fixee en dur) : les deux colonnes s'etirent sur la hauteur REELLEMENT
          disponible (align-items:stretch par defaut), donc ca reste correct meme sur un ecran bas —
          contrairement a une premiere version en px fixes qui debordait sous le footer. */}
      <div style={{ padding: 22, display: 'flex', gap: 22, flex: 1, minHeight: 0 }}>
        {/* Media : ne bouge jamais, quelle que soit la longueur du texte a cote.
            Pas de scroll ici : l'aperçu (video ou image) est en flex:1 comme la
            colonne texte, donc il epouse la hauteur reellement disponible au lieu
            d'imposer une hauteur fixe qui deborderait sur un ecran bas. */}
        <div style={{ width: 260, flexShrink: 0, display: 'flex', flexDirection: 'column', gap: 8 }}>
          {type === 'video' ? (
            <>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 10px', borderRadius: 9,
                background: 'rgba(34,197,94,.1)', border: '1px solid rgba(34,197,94,.25)', flexShrink: 0 }}>
                <span style={{ width: 16, height: 16, borderRadius: 4, background: '#22c55e', display: 'grid', placeItems: 'center',
                  fontSize: 9, fontWeight: 800, color: '#052e16' }}>▶</span>
                <span style={{ fontSize: 11.5, color: '#bbf7d0', fontWeight: 600, flex: 1 }}>MP4 File 8.93 MB</span>
                <CloseIcon style={{ width: 13, height: 13, color: '#fca5a5', cursor: 'pointer' }} />
              </div>
              <div style={{ minHeight: 300, flex: 1, borderRadius: 14, overflow: 'hidden', background: 'linear-gradient(165deg,#e0e7ff,#818cf8 45%,#4c1d95)',
                position: 'relative' }}>
                <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
                  opacity: .5 }}>
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 8l7 4-7 4V8z" fill="#fff" stroke="none"/></svg>
                </div>
                <span style={{ position: 'absolute', bottom: 10, left: 10, fontSize: 10.5, color: 'rgba(255,255,255,.85)',
                  fontFamily: 'Sora,sans-serif', fontWeight: 700, background: 'rgba(0,0,0,.35)', padding: '3px 8px', borderRadius: 6 }}>
                  aperçu vidéo
                </span>
              </div>
            </>
          ) : (
            <>
              {/* Image : agrandissable au clic (lightbox), meme correction que celle deja
                  poussee en prod — plus de hauteur illimitee qui pousse tout hors champ.
                  flex:1 (comme la video) au lieu d'un aspect-ratio fixe : sur un ecran
                  bas, l'aperçu se tasse plutot que de forcer un scroll de la colonne. */}
              <div style={{ position: 'relative', borderRadius: 14, overflow: 'hidden', cursor: 'zoom-in', flexShrink: 0,
                minHeight: 160, flex: 1, background: 'linear-gradient(160deg,#fde68a,#fb923c 55%,#7c2d12)' }}>
                <span style={{ position: 'absolute', bottom: 8, left: 8, fontSize: 10, color: 'rgba(255,255,255,.85)',
                  fontFamily: 'Sora,sans-serif', fontWeight: 700, background: 'rgba(0,0,0,.35)', padding: '3px 8px', borderRadius: 6 }}>
                  aperçu image
                </span>
              </div>

              {/* Retoucher : deja en prod, ouvre un champ texte libre sur place */}
              {retoucheOuverte ? (
                <div style={{ borderRadius: 12, border: '1px solid var(--line2)', background: 'rgba(255,255,255,.02)', padding: 10, flexShrink: 0 }}>
                  <textarea placeholder="Ex. : enlève le carton, corrige la bande grise en bas…" rows={2}
                    style={{ width: '100%', background: '#0a0f1c', border: '1px solid var(--line2)', color: '#e5e7eb',
                      borderRadius: 9, padding: '8px 10px', fontSize: 12.5, fontFamily: 'Inter,sans-serif', resize: 'none', outline: 'none' }} />
                  <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
                    <button type="button" onClick={() => setRetoucheOuverte(false)} style={{ background: 'transparent', border: 'none',
                      color: '#94a3b8', fontSize: 12, fontFamily: 'Inter,sans-serif', fontWeight: 600, cursor: 'pointer' }}>Annuler</button>
                    <button type="button" className="sora" style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
                      padding: '7px 0', borderRadius: 9, border: 'none', background: 'var(--grad)', color: '#fff', fontSize: 12, fontWeight: 700, cursor: 'pointer' }}>
                      <ScissorsIcon style={{ width: 13, height: 13 }} />Appliquer
                    </button>
                  </div>
                </div>
              ) : (
                <button type="button" onClick={() => setRetoucheOuverte(true)} style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
                  gap: 7, padding: '9px 0', borderRadius: 10, border: '1px solid var(--line2)', background: 'transparent',
                  color: '#cbd5e1', fontSize: 12.5, fontWeight: 700, fontFamily: 'Sora,sans-serif', cursor: 'pointer', flexShrink: 0 }}>
                  <ScissorsIcon />Retoucher
                </button>
              )}

              <button type="button" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, padding: '9px 0',
                borderRadius: 10, border: 'none', background: 'linear-gradient(135deg,#5B6CFF22,#8A6CFF22)', color: '#a5b0ff',
                fontSize: 12.5, fontWeight: 700, fontFamily: 'Sora,sans-serif', cursor: 'pointer', flexShrink: 0, borderColor: 'rgba(91,108,255,.4)', borderWidth: 1, borderStyle: 'solid' }}>
                <WandIcon />Changer le visuel
              </button>
            </>
          )}
        </div>

        {/* Texte du post : SEULE zone qui scrolle, dans le meme espace vertical que le media */}
        <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: '.5px', textTransform: 'uppercase',
            color: 'var(--mut2)', marginBottom: 10, flexShrink: 0 }}>Texte du post</div>
          <div style={{ flex: 1, overflowY: 'auto', paddingRight: 8, minHeight: 0 }}>
            <p style={{ margin: 0, fontSize: 14.5, lineHeight: 1.75, color: '#dbe2f0', whiteSpace: 'pre-wrap', maxWidth: 640 }}>
              {texte}
            </p>
          </div>
        </div>
      </div>

      {/* FOOTER — hors du scroll, toujours visible */}
      <div style={{ flexShrink: 0, borderTop: '1px solid var(--line2)', padding: '15px 22px',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
        <button type="button" style={{ display: 'flex', alignItems: 'center', gap: 7, background: 'transparent', border: 'none',
          color: '#94a3b8', fontSize: 13, fontFamily: 'Inter,sans-serif', fontWeight: 600, cursor: 'pointer', padding: '8px 4px' }}>
          <TrashIcon />Supprimer
        </button>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', justifyContent: 'flex-end' }}>
          {/* Vidéo non publiée : toujours ces deux actions d'édition, quel que soit le statut de publication
              (equivalent video du "Retoucher" cote image, qui lui vit dans la colonne media, pas ici). */}
          {type === 'video' && (
            <>
              <button type="button" style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '10px 16px', borderRadius: 11,
                border: '1px solid rgba(138,108,255,.4)', background: 'rgba(138,108,255,.1)', color: '#c4b5fd', fontSize: 13, fontWeight: 700,
                fontFamily: 'Sora,sans-serif', cursor: 'pointer' }}>
                <ClapperIcon />Ouvrir l'éditeur
              </button>
              <button type="button" style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '10px 16px', borderRadius: 11,
                border: '1px solid var(--line2)', background: 'rgba(255,255,255,.05)', color: '#e5e7eb', fontSize: 13, fontWeight: 700,
                fontFamily: 'Sora,sans-serif', cursor: 'pointer' }}>
                <VideoIcon />Modifier la vidéo
              </button>
            </>
          )}
          <button type="button" style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '10px 18px', borderRadius: 11,
            border: '1px solid var(--line2)', background: 'transparent', color: '#e5e7eb', fontSize: 13.5, fontWeight: 700,
            fontFamily: 'Sora,sans-serif', cursor: 'pointer' }}>
            <RefreshIcon />Replanifier
          </button>
          <button type="button" className="sora" style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '11px 22px',
            borderRadius: 11, border: 'none', background: 'var(--grad)', color: '#fff', fontSize: 13.5, fontWeight: 700,
            cursor: 'pointer', boxShadow: '0 8px 24px rgba(91,108,255,.35)' }}>
            <CalendarIcon />Réessayer
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [showDev, setShowDev] = useState(true);
  const [texteLong, setTexteLong] = useState(false);
  const [type, setType] = useState('video');
  return (
    <React.Fragment>
      {showDev && (
        <div className="devbar">
          <b>Maquette de review</b>
          <span>— bascule le type de média et la longueur du texte pour vérifier le footer dans tous les cas.</span>
          <button className={`devbtn ${type === 'image' ? 'on' : ''}`} style={{ marginLeft: 'auto' }}
            onClick={() => setType((v) => (v === 'video' ? 'image' : 'video'))}>
            Type : {type === 'video' ? 'Vidéo (clique pour Image)' : 'Image (clique pour Vidéo)'}
          </button>
          <button className={`devbtn ${texteLong ? 'on' : ''}`}
            onClick={() => setTexteLong((v) => !v)}>
            Texte : {texteLong ? 'très long (clique pour raccourcir)' : 'court (clique pour allonger)'}
          </button>
          <button className="devbtn" onClick={() => setShowDev(false)}>Masquer cette barre</button>
        </div>
      )}
      <div className="stage" style={{ inset: showDev ? '46px 0 0 0' : 0, height: showDev ? 'calc(100vh - 46px)' : '100vh' }}>
        <ContenuDialog texteLong={texteLong} type={type} />
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
